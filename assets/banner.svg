<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient for Text & Shapes -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes pulse-glow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes circuit-flow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-chip {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .animated-bg-grid {
        stroke: #21262d;
        stroke-width: 1;
        opacity: 0.4;
      }
      .circuit-line {
        stroke: url(#accent-grad);
        stroke-width: 2;
        stroke-dasharray: 20 10;
        animation: circuit-flow 12s linear infinite;
        opacity: 0.6;
      }
      .glowing-orb {
        animation: pulse-glow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-hardware {
        animation: float-chip 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Circuit Grid Background -->
  <g class="animated-bg-grid">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" />
  </g>

  <!-- Background Dynamic Circuit Lines -->
  <path class="circuit-line" d="M 50,300 L 250,300 L 350,200 L 600,200 L 700,300 L 1150,300" fill="none" />
  <path class="circuit-line" d="M 100,50 L 300,50 L 400,150 L 800,150 L 900,50 L 1100,50" fill="none" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle class="glowing-orb" cx="150" cy="180" r="120" fill="#58a6ff" filter="url(#glow)" opacity="0.15" />
  <circle class="glowing-orb" cx="1050" cy="180" r="140" fill="#bc8cff" filter="url(#glow)" opacity="0.15" />

  <!-- Floating Decorative Chip Icons (Side elements) -->
  <g class="floating-hardware" transform="translate(80, 140)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
    <text x="25" y="32" font-family="system-ui, sans-serif" font-size="20" fill="#58a6ff" text-anchor="middle">🎮</text>
  </g>
  <g class="floating-hardware" transform="translate(1070, 140)">
    <rect x="0" y="0" width="50" height="50" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2" />
    <text x="25" y="32" font-family="system-ui, sans-serif" font-size="20" fill="#bc8cff" text-anchor="middle">⚙️</text>
  </g>

  <!-- FOREGROUND CONTENT (Foreground Text and Title - Always Crisp & Visible) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="420" y="45" width="360" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="600" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#58a6ff" letter-spacing="1">
      ⚡ HARDWARE ECOSYSTEM &amp; EMBEDDED SYSTEMS ⚡
    </text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Video Game Console Hardware
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#8b949e">
      Commercial Platforms, RISC-V SoCs, FPGA Consoles &amp; Handheld Hardware
    </text>

    <!-- Feature Pills -->
    <g transform="translate(330, 240)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="38" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
      <text x="80" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#58a6ff">☁️ SaaS &amp; Consoles</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="38" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5" />
      <text x="270" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#bc8cff">🛠️ RISC-V &amp; FPGA</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="160" height="38" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5" />
      <text x="460" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#3fb950">🐧 Custom OS &amp; FW</text>
    </g>
  </g>
</svg>
